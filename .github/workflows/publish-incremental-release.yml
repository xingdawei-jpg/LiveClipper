name: Publish incremental release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release metadata
        uses: actions/checkout@v4

      - name: Validate release specification and download assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          spec_path = Path("release/github") / f"{tag}.json"
          if not spec_path.is_file():
              raise SystemExit(f"Missing release specification: {spec_path}")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          if spec.get("tag") != tag:
              raise SystemExit("Release tag does not match the specification")

          title = str(spec.get("title") or "").strip()
          notes = str(spec.get("notes") or "").strip()
          assets = spec.get("assets")
          if not title or not notes or not isinstance(assets, list) or not assets:
              raise SystemExit("Release specification is incomplete")

          allowed_hosts = {"lc-update.oss-cn-beijing.aliyuncs.com"}
          asset_dir = Path("release-assets")
          asset_dir.mkdir()

          for asset in assets:
              name = str(asset.get("name") or "")
              url = str(asset.get("url") or "")
              expected = str(asset.get("sha256") or "").upper()
              parsed = urllib.parse.urlparse(url)
              if not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                  raise SystemExit(f"Unsafe asset name: {name!r}")
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                  raise SystemExit(f"Unapproved asset URL: {url}")
              if not re.fullmatch(r"[0-9A-F]{64}", expected):
                  raise SystemExit(f"Invalid SHA256 for {name}")

              destination = asset_dir / name
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "LiveClipper-GitHub-Release"},
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  with destination.open("wb") as output:
                      shutil.copyfileobj(response, output)

              actual = hashlib.sha256(destination.read_bytes()).hexdigest().upper()
              if actual != expected:
                  raise SystemExit(
                      f"SHA256 mismatch for {name}: expected {expected}, got {actual}"
                  )

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"title={title}\n")
          PY
        id: prepare

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md
          fi
