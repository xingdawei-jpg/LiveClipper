name: Verify GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out tagged release metadata
        uses: actions/checkout@v4

      - name: Validate GitHub release specification
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          spec_path = Path("release/github") / f"{tag}.json"
          if not spec_path.is_file():
              raise SystemExit(f"Missing release specification: {spec_path}")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          if spec.get("tag") != tag:
              raise SystemExit("Release tag does not match the specification")

          title = str(spec.get("title") or "").strip()
          notes = str(spec.get("notes") or "").strip()
          assets = spec.get("assets")
          if not title or not notes or not isinstance(assets, list) or not assets:
              raise SystemExit("Release specification is incomplete")

          names = set()
          for asset in assets:
              name = str(asset.get("name") or "")
              expected_hash = str(asset.get("sha256") or "").upper()
              expected_size = asset.get("size")
              if not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                  raise SystemExit(f"Unsafe asset name: {name!r}")
              if name in names:
                  raise SystemExit(f"Duplicate asset name: {name}")
              names.add(name)
              if not re.fullmatch(r"[0-9A-F]{64}", expected_hash):
                  raise SystemExit(f"Invalid SHA256 for {name}")
              if not isinstance(expected_size, int) or expected_size <= 0:
                  raise SystemExit(f"Invalid size for {name}")
          PY

      - name: Wait for the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 120); do
            if gh release view "${RELEASE_TAG}" \
              --json isDraft,name,body,assets > actual-release.json 2>/dev/null; then
              if python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = json.loads(
              (Path("release/github") / f"{tag}.json").read_text(encoding="utf-8")
          )
          actual = json.loads(Path("actual-release.json").read_text(encoding="utf-8"))

          expected_assets = {
              item["name"]: int(item["size"])
              for item in expected["assets"]
          }
          actual_assets = {
              item["name"]: int(item["size"])
              for item in actual.get("assets") or []
          }
          ready = (
              not actual.get("isDraft")
              and str(actual.get("name") or "").strip() == expected["title"].strip()
              and str(actual.get("body") or "").strip() == expected["notes"].strip()
              and actual_assets == expected_assets
          )
          if not ready:
              raise SystemExit(1)
          PY
              then
                break
              fi
            fi

            if [ "${attempt}" -eq 120 ]; then
              echo "Timed out waiting for the complete published GitHub release."
              exit 1
            fi
            sleep 30
          done

      - name: Download and verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          spec = json.loads(
              (Path("release/github") / f"{tag}.json").read_text(encoding="utf-8")
          )
          asset_dir = Path("release-assets")
          expected_names = {item["name"] for item in spec["assets"]}
          actual_names = {item.name for item in asset_dir.iterdir() if item.is_file()}
          if actual_names != expected_names:
              raise SystemExit(
                  f"Release asset set mismatch: expected {sorted(expected_names)}, "
                  f"got {sorted(actual_names)}"
              )

          for asset in spec["assets"]:
              path = asset_dir / asset["name"]
              actual_size = path.stat().st_size
              if actual_size != int(asset["size"]):
                  raise SystemExit(
                      f"Size mismatch for {path.name}: expected {asset['size']}, "
                      f"got {actual_size}"
                  )

              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual_hash = digest.hexdigest().upper()
              expected_hash = str(asset["sha256"]).upper()
              if actual_hash != expected_hash:
                  raise SystemExit(
                      f"SHA256 mismatch for {path.name}: expected {expected_hash}, "
                      f"got {actual_hash}"
                  )
          PY
